<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Villa AR — demo HomeTourAI</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #ui{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:8px;align-items:center;
      padding:10px 12px;background:rgba(10,12,16,.78);color:#fff;backdrop-filter:blur(4px)}
  #ui .t{font-size:13px;font-weight:700;margin-right:auto}
  #ui button{border:1px solid #7dd3fc;background:rgba(125,211,252,.15);color:#fff;font-size:12px;
      font-weight:600;padding:8px 12px;border-radius:18px;cursor:pointer}
  #ui button.on{background:#7dd3fc;color:#06283a}
  #hint{position:fixed;bottom:0;left:0;right:0;z-index:10;text-align:center;color:#fff;
      font-size:12px;padding:10px;background:rgba(10,12,16,.7)}
  #hint a{color:#7dd3fc}
  a-scene{position:fixed;inset:0}
</style>
</head>
<body>
<div id="ui">
  <span class="t">Villa AR</span>
  <button data-m="soggiorno" class="on">Soggiorno</button>
  <button data-m="villa">Villa unica</button>
  <button data-m="esterno">Esterno</button>
</div>
<div id="hint">Inquadra il <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">marker HIRO</a> (mostralo su un altro schermo o stampalo)</div>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
  <a-marker preset="hiro">
    <a-entity id="model" gltf-model="url(https://cdn.jsdelivr.net/gh/aledesogusbusiness-hue/hometour-demo-assets@main/soggiorno.glb)"
              scale="0.12 0.12 0.12" position="0 0 0"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<script>
const CDN='https://cdn.jsdelivr.net/gh/aledesogusbusiness-hue/hometour-demo-assets@main/';
const MODELS={
  soggiorno:{url:CDN+'soggiorno.glb',   scale:'0.12 0.12 0.12'},
  villa:    {url:CDN+'villa-unica.glb', scale:'0.025 0.025 0.025'},
  esterno:  {url:CDN+'esterno.glb',     scale:'0.02 0.02 0.02'}
};
const el=document.getElementById('model');
document.querySelectorAll('#ui button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#ui button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const m=MODELS[b.dataset.m];
    el.setAttribute('gltf-model','url('+m.url+')');
    el.setAttribute('scale',m.scale);
  });
});
</script>
</body>
</html>
