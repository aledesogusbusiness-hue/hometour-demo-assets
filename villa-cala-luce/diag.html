<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villa Cala Luce — Walkable Cycles/PBR Viewer</title>
  <style>
    :root {
      --bg-glass: rgba(18, 18, 20, 0.78);
      --border-glass: rgba(255, 255, 255, 0.14);
      --accent: #d4af37;
    }
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0d0d0f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f4f4f6;
    }
    #canvas-container { width: 100%; height: 100%; position: relative; }

    /* Top HUD */
    .hud-top {
      position: fixed; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .panel {
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px 18px;
      pointer-events: auto;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    .brand-title {
      font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #fff; margin: 0 0 4px 0;
    }
    .brand-sub {
      font-size: 12px; color: #a0a0ab; margin: 0;
    }
    .controls-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    button, .file-label {
      background: rgba(255, 255, 255, 0.08);
      color: #eee; border: 1px solid rgba(255,255,255,0.16);
      padding: 8px 13px; border-radius: 8px; font-size: 12px;
      font-weight: 500; cursor: pointer; transition: all 0.2s ease;
    }
    button:hover, .file-label:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent);
    }
    button.active {
      background: var(--accent); color: #111;
      border-color: var(--accent); font-weight: 600;
    }
    input[type="file"] { display: none; }

    /* Sample Counter Badge */
    #pt-status {
      font-size: 11px; font-family: monospace;
      color: var(--accent); margin-top: 8px; display: none;
    }

    /* Crosshair per Walk Mode */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5; display: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.75);
    }
    #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
    #crosshair::after  { top: 0; left: 4px; width: 2px; height: 10px; }

    /* Bottom Controls & Teleport Bar */
    .hud-bottom {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      z-index: 10; pointer-events: auto;
    }
    .help-hint {
      position: fixed; bottom: 78px; left: 50%;
      transform: translateX(-50%);
      font-size: 12px; color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.6); padding: 6px 14px;
      border-radius: 20px; pointer-events: none; z-index: 10;
      white-space: nowrap;
    }

    /* Mobile Touch Joystick */
    #joystick-zone {
      position: fixed; bottom: 90px; left: 30px;
      width: 110px; height: 110px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      display: none; z-index: 15; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(212, 175, 55, 0.85);
      pointer-events: none;
    }
    @media (hover: none) and (pointer: coarse) {
      #joystick-zone { display: block; }
    }
  </style>

  <!-- Import Map con Three.js, Postprocessing e GPU PathTracer -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.4/build/index.module.js",
      "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.21/build/index.module.js"
    }
  }
  </script>
<script>
window.__dlog = function(m) {
  var b = document.getElementById('diagbox');
  if (b) b.textContent += m + '\n';
  console.log('[diag] ' + m);
};
window.addEventListener('error', function(e) {
  window.__dlog('ERRORE: ' + e.message + ' @' + String(e.filename||'').split('/').pop() + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  window.__dlog('PROMISE REJECT: ' + String(e.reason).slice(0, 200));
});
try {
  var c = document.createElement('canvas');
  var gl = c.getContext('webgl2') || c.getContext('webgl');
  window.__dlog('WebGL: ' + (gl ? 'OK ' + gl.getParameter(gl.VERSION) : 'NON DISPONIBILE'));
} catch (err) { window.__dlog('WebGL eccezione: ' + err.message); }
window.__dlog('UA: ' + navigator.userAgent.slice(0, 90));
</script>
<style>
#diagbox { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: rgba(0,0,0,.88);
  color: #4f4; font: 11px/1.5 monospace; padding: 26px 8px 8px 8px; max-height: 45%; overflow: auto;
  white-space: pre-wrap; word-break: break-all; }
#diaghide { position: fixed; top: 2px; right: 6px; z-index: 10000; background: #333; color: #fff;
  border: 1px solid #666; border-radius: 6px; padding: 2px 10px; font-size: 12px; }
</style>
</head>
<body>
<button id="diaghide" onclick="document.getElementById('diagbox').style.display='none';this.style.display='none'">nascondi log</button>
<div id="diagbox"></div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- Top UI -->
  <div class="hud-top">
    <div class="panel">
      <h1 class="brand-title">Villa Cala Luce</h1>
      <p class="brand-sub">Living Panoramico 6.0×5.5m • H 3.40m • Terrazza Infinity</p>
      <div id="pt-status">CYCLES GPU PATHTRACER: <span id="sample-count">0</span> samples</div>
    </div>

    <div class="panel">
      <div class="controls-row">
        <button id="btn-walk" class="active">🚶 Cammina (First-Person)</button>
        <button id="btn-orbit">🔄 Orbit 3D</button>
        <span style="opacity:0.3">|</span>
        <button id="btn-pbr" class="active">⚡ Real-Time AgX + GI</button>
        <button id="btn-cycles">✨ Cycles PathTracer</button>
        <span style="opacity:0.3">|</span>
        <button id="btn-export">💾 Esporta .GLB</button>
        <label class="file-label">
          📂 Carica .GLB
          <input type="file" id="input-glb" accept=".glb,.gltf" />
        </label>
      </div>
    </div>
  </div>

  <!-- Help Banner -->
  <div class="help-hint" id="help-hint">
    Clicca nella scena per guardarti intorno • <b>W A S D / Frecce</b> per camminare • <b>Shift</b> passo veloce • <b>ESC</b> libera il mouse
  </div>

  <!-- Mobile Virtual Joystick -->
  <div id="joystick-zone"><div id="joystick-knob"></div></div>

  <!-- Bottom Camera Waypoints -->
  <div class="hud-bottom panel">
    <span style="font-size:12px; color:#aaa; margin-right:4px;">Punti Vista:</span>
    <button onclick="window.teleportTo('ingresso')">Ingresso Living</button>
    <button onclick="window.teleportTo('divano')">Zona Lounge</button>
    <button onclick="window.teleportTo('cucina')">Isola Travertino</button>
    <button onclick="window.teleportTo('terrazza')">Terrazza & Piscina</button>
    <span style="opacity:0.3">|</span>
    <span style="font-size:12px; color:#aaa;">Sole:</span>
    <input type="range" id="sun-slider" min="8" max="75" value="22" style="width:90px; accent-color:#d4af37;" title="Altezza del sole (Golden Hour)" />
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { WebGLPathTracer } from 'three-gpu-pathtracer';
    window.__dlog('moduli caricati OK');

    // --- 1. CONFIGURAZIONE RENDERER CON TONE MAPPING AGX (STILE BLENDER 4.2+) ---
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0.3, 1.70, -0.5); // spawn libero (non dentro l'isola)
    camera.rotation.order = 'YXZ';

    // --- 2. POST-PROCESSING (BLOOM MORBIDO SU ALTE LUCI E VETRATE) ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.16, // strength delicata per realismo fotografico
      0.55, // radius
      0.92  // threshold alto solo per riflessi solari e LED
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // --- 3. GPU PATH TRACER (MODALITÀ CYCLES) ---
    let pathTracer = null;
    let isCyclesMode = false;
    function initPathTracer() {
      if (!pathTracer) {
        pathTracer = new WebGLPathTracer(renderer);
        pathTracer.bounces = 5;
        pathTracer.renderScale = 0.75;
        pathTracer.tiles.set(2, 2);
      }
      // La mesh Sky usa uno ShaderMaterial che il path tracer non sa leggere:
      // la si esclude dalla BVH e si usa il cielo equirettangolare come sfondo
      // e come environment (il path tracer non accetta la texture PMREM).
      captureSkyEquirect();
      scene.background = skyEquirectRT.texture;
      scene.environment = skyEquirectDataTex;
      scene.remove(sky);
      try {
        pathTracer.setScene(scene, camera);
      } finally {
        scene.add(sky); // resta visibile in modalità PBR
      }
    }

    // --- 4. GENERATORI DI TEXTURE PROCEDURALI PBR AD ALTA RISOLUZIONE ---
    function createTravertineTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e7dfd3';
      ctx.fillRect(0, 0, 1024, 1024);

      // Venature longitudinali del travertino levigato
      for (let i = 0; i < 420; i++) {
        const y = Math.random() * 1024;
        const h = 1 + Math.random() * 6;
        const alpha = 0.02 + Math.random() * 0.05;
        ctx.fillStyle = i % 2 === 0 ? `rgba(185, 170, 148, ${alpha})` : `rgba(255, 250, 242, ${alpha})`;
        ctx.fillRect(0, y, 1024, h);
      }
      // Giunti lastre grandi formato 120x120
      ctx.strokeStyle = 'rgba(140, 128, 112, 0.28)';
      ctx.lineWidth = 2;
      for (let p = 0; p <= 1024; p += 256) {
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 1024); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(1024, p); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createDioriteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3a3d40';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const s = 1 + Math.random() * 2.5;
        const v = 40 + Math.floor(Math.random() * 55);
        ctx.fillStyle = `rgb(${v},${v+2},${v+4})`;
        ctx.fillRect(x, y, s, s);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createOakWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5e4028';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 300; i++) {
        ctx.fillStyle = `rgba(38, 22, 10, ${0.03 + Math.random() * 0.06})`;
        ctx.fillRect(Math.random() * 512, 0, 1 + Math.random() * 3, 512);
      }
      // Doghe verticali boiserie
      ctx.fillStyle = 'rgba(20, 12, 6, 0.55)';
      for (let x = 0; x < 512; x += 32) {
        ctx.fillRect(x, 0, 3, 512);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 1);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- 5. COSTRUZIONE ARCHITETTONICA VILLA CALA LUCE (SCALA METRICA 1:1) ---
    const architectureGroup = new THREE.Group();
    architectureGroup.name = "Villa_Cala_Luce_Master";
    scene.add(architectureGroup);

    // Lista di BoundingBox 2D [minX, maxX, minZ, maxZ] per collisioni camminata
    const wallColliders = [];
    function addBoxMesh(w, h, d, mat, x, y, z, addCollider = true, castShadow = true) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      architectureGroup.add(mesh);
      if (addCollider) {
        wallColliders.push({
          minX: x - w / 2 - 0.28,
          maxX: x + w / 2 + 0.28,
          minZ: z - d / 2 - 0.28,
          maxZ: z + d / 2 + 0.28
        });
      }
      return mesh;
    }

    function buildVillaCalaLuce() {
      const travertineTex = createTravertineTexture();
      const dioriteTex = createDioriteTexture();
      const oakTex = createOakWoodTexture();

      // Materiali PBR calibrati per AgX e PathTracing
      const matTravertine = new THREE.MeshStandardMaterial({
        map: travertineTex, bumpMap: travertineTex, bumpScale: 0.004,
        roughness: 0.24, metalness: 0.02
      });
      const matPlaster = new THREE.MeshStandardMaterial({
        color: 0xf5f2eb, roughness: 0.78, metalness: 0.0
      });
      const matDiorite = new THREE.MeshStandardMaterial({
        map: dioriteTex, bumpMap: dioriteTex, bumpScale: 0.015,
        roughness: 0.65, metalness: 0.05
      });
      const matOak = new THREE.MeshStandardMaterial({
        map: oakTex, bumpMap: oakTex, bumpScale: 0.008,
        roughness: 0.42, metalness: 0.02
      });
      const matBronze = new THREE.MeshStandardMaterial({
        color: 0x2c221e, roughness: 0.28, metalness: 0.88
      });
      const matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.18,
        roughness: 0.02, metalness: 0.0, transmission: 0.92,
        ior: 1.52, thickness: 0.02, reflectiveness: 0.9
      });
      const matBoucle = new THREE.MeshStandardMaterial({
        color: 0xeae4dc, roughness: 0.88
      });
      const matWater = new THREE.MeshPhysicalMaterial({
        color: 0x16697a, roughness: 0.08, metalness: 0.05,
        transmission: 0.82, ior: 1.333, thickness: 1.4
      });
      const matPoolTiles = new THREE.MeshStandardMaterial({
        color: 0x1b3a4b, roughness: 0.3
      });
      const matLedWarm = new THREE.MeshStandardMaterial({
        color: 0xfff1d0, emissive: 0xffb85c, emissiveIntensity: 3.2
      });

      // 1. Pavimento interno Living (6.0m x 5.5m) + Terrazza esterna (6.0m x 4.5m)
      addBoxMesh(6.4, 0.25, 10.2, matTravertine, 0, -0.125, -2.2, false, false);

      // 2. Soffitto interno H 3.40m con sbalzo bioclimatico esterno
      addBoxMesh(6.6, 0.28, 7.6, matPlaster, 0, 3.54, -0.6, false, true);

      // 3. Gola LED perimetrale a soffitto (luce indiretta calda)
      addBoxMesh(5.6, 0.03, 0.06, matLedWarm, 0, 3.39, 2.5, false, false);
      addBoxMesh(5.6, 0.03, 0.06, matLedWarm, 0, 3.39, -2.5, false, false);

      // 4. Pareti Perimetrali
      // Parete Nord (Fondo Living/Cucina: Z = +2.75)
      addBoxMesh(6.4, 3.4, 0.3, matPlaster, 0, 1.7, 2.9, true);
      // Parete Ovest in Pietra Diorite (X = -3.0)
      addBoxMesh(0.35, 3.4, 6.2, matDiorite, -3.1, 1.7, -0.1, true);
      // Parete Est in Intonaco a Calce + Boiserie in Rovere Termotrattato (X = +3.0)
      addBoxMesh(0.3, 3.4, 5.8, matPlaster, 3.1, 1.7, 0.0, true);
      addBoxMesh(0.06, 3.4, 3.6, matOak, 2.92, 1.7, 0.6, false);

      // 5. Vetrata Panoramica Sud Cielo-Terra (Z = -2.75) con varco scorrevole aperto al centro
      // Montanti in alluminio bronzo brunito
      addBoxMesh(6.0, 0.08, 0.12, matBronze, 0, 3.36, -2.75, false); // Binario superiore
      addBoxMesh(6.0, 0.04, 0.12, matBronze, 0, 0.02, -2.75, false); // Binario inferiore a filo
      addBoxMesh(0.08, 3.4, 0.12, matBronze, -2.9, 1.7, -2.75, false);
      addBoxMesh(0.08, 3.4, 0.12, matBronze, -1.1, 1.7, -2.75, true); // Montante anta SX
      addBoxMesh(0.08, 3.4, 0.12, matBronze, 1.1, 1.7, -2.75, true);  // Montante anta DX
      addBoxMesh(0.08, 3.4, 0.12, matBronze, 2.9, 1.7, -2.75, false);

      // Lastre di vetro fisso laterali (il centro da X = -1.1 a X = +1.1 è aperto per camminare fuori!)
      addBoxMesh(1.8, 3.3, 0.03, matGlass, -2.0, 1.68, -2.75, true, false);
      addBoxMesh(1.8, 3.3, 0.03, matGlass, 2.0, 1.68, -2.75, true, false);

      // 6. Isola Monolitica in Travertino (Zona Cucina: X = +1.4, Z = +1.4)
      addBoxMesh(2.4, 0.92, 1.05, matTravertine, 1.25, 0.46, 1.45, true);
      // Basi retrocucina incassate nella parete Nord
      addBoxMesh(2.8, 0.90, 0.65, matOak, 1.35, 0.45, 2.42, true);
      addBoxMesh(2.8, 0.04, 0.68, matTravertine, 1.35, 0.92, 2.42, false);

      // 7. Zona Living: Divano Modulare L-Shape in Bouclé Avorio (X = -1.4, Z = +0.2)
      const sofaGroup = new THREE.Group();
      const seat1 = new THREE.Mesh(new RoundedBoxGeometry(2.5, 0.42, 1.05, 4, 0.08), matBoucle);
      seat1.position.set(-1.3, 0.21, 0.4);
      seat1.castShadow = seat1.receiveShadow = true;
      sofaGroup.add(seat1);

      const seatChaise = new THREE.Mesh(new RoundedBoxGeometry(1.05, 0.42, 1.2, 4, 0.08), matBoucle);
      seatChaise.position.set(-2.02, 0.21, -0.65);
      seatChaise.castShadow = seatChaise.receiveShadow = true;
      sofaGroup.add(seatChaise);

      const backrest = new THREE.Mesh(new RoundedBoxGeometry(2.5, 0.45, 0.28, 4, 0.07), matBoucle);
      backrest.position.set(-1.3, 0.58, 0.78);
      backrest.castShadow = backrest.receiveShadow = true;
      sofaGroup.add(backrest);

      const armrest = new THREE.Mesh(new RoundedBoxGeometry(0.26, 0.55, 2.15, 4, 0.06), matBoucle);
      armrest.position.set(-2.45, 0.30, -0.15);
      armrest.castShadow = armrest.receiveShadow = true;
      sofaGroup.add(armrest);

      architectureGroup.add(sofaGroup);
      wallColliders.push({ minX: -2.65, maxX: -0.05, minZ: -1.35, maxZ: 1.05 });

      // Coffee Table Basso in Travertino e Bronzo
      addBoxMesh(1.1, 0.28, 1.1, matTravertine, -1.0, 0.14, -0.95, true);

      // 8. Terrazza Panoramica & Piscina a Sfioro (Sud: Z da -4.6 a -7.0)
      // Vasca piscina a sfioro
      addBoxMesh(5.8, 0.9, 2.3, matPoolTiles, 0, -0.5, -5.85, false, false);
      const waterMesh = addBoxMesh(5.6, 0.75, 2.15, matWater, 0, -0.04, -5.85, true, false);
      waterMesh.receiveShadow = true;

      // Parapetto in cristallo strutturale a filo terrazza per evitare cadute nel vuoto
      addBoxMesh(0.04, 1.1, 4.5, matGlass, -3.1, 0.55, -5.0, true, false);
      addBoxMesh(0.04, 1.1, 4.5, matGlass, 3.1, 0.55, -5.0, true, false);
      // Limite Sud piscina
      wallColliders.push({ minX: -3.5, maxX: 3.5, minZ: -4.75, maxZ: -4.45 });
    }

    buildVillaCalaLuce();
    window.__dlog('villa costruita OK');

    // --- 6. ILLUMINAZIONE FISICA: CIELO SOLARE + PMREM HDRI + DIRECTIONAL SUN ---
    const sky = new Sky();
    sky.scale.setScalar(450);
    scene.add(sky);

    const sunLight = new THREE.DirectionalLight(0xfff1dc, 3.0);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 35;
    const d = 9;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Luce interna di riempimento soffusa (simula il bounce sul travertino in modalità Real-Time)
    const bounceLight = new THREE.HemisphereLight(0xfff6e8, 0xd8cbb8, 0.5);
    scene.add(bounceLight);
    scene.environmentIntensity = 0.55; // evita bruciature con cielo + sole + emisfero

    const pmremGenerator = new THREE.PMREMGenerator(renderer);

    // --- 7. COMPLETAMENTO: sole, controlli, collisioni, loop ---

    // 7a. Posizione sole + ambiente PMREM dal cielo
    const sunDir = new THREE.Vector3();
    const envScene = new THREE.Scene();
    const envSky = new Sky();
    envSky.scale.setScalar(1000);
    envScene.add(envSky);
    function updateEnvironment() {
      const u = sky.material.uniforms, eu = envSky.material.uniforms;
      eu['sunPosition'].value.copy(u['sunPosition'].value);
      eu['turbidity'].value = u['turbidity'].value;
      eu['rayleigh'].value = u['rayleigh'].value;
      eu['mieCoefficient'].value = u['mieCoefficient'].value;
      eu['mieDirectionalG'].value = u['mieDirectionalG'].value;
      const rt = pmremGenerator.fromScene(envScene, 0.04);
      pmremEnvTex = rt.texture;
      scene.environment = pmremEnvTex;
      captureSkyEquirect(); // tiene lo sfondo Cycles sincronizzato col sole
    }
    // Cattura il cielo procedurale in una texture equirettangolare:
    // serve come scene.background nella modalità Cycles (la mesh Sky usa
    // uno ShaderMaterial che il path tracer non sa leggere) e come
    // scene.environment leggibile su CPU (il path tracer non accetta PMREM).
    const skyCubeRT = new THREE.WebGLCubeRenderTarget(128);
    const skyCubeCam = new THREE.CubeCamera(1, 2000, skyCubeRT);
    const SKY_EQ_W = 1024, SKY_EQ_H = 512;
    let skyEquirectRT = null, skyEquirectConv = null, skyEquirectOrtho = null;
    let skyEquirectDataTex = null, pmremEnvTex = null;
    function captureSkyEquirect() {
      skyCubeCam.update(renderer, envScene);
      if (!skyEquirectRT) {
        skyEquirectRT = new THREE.WebGLRenderTarget(SKY_EQ_W, SKY_EQ_H);
        const convMat = new THREE.ShaderMaterial({
          uniforms: { cubeMap: { value: skyCubeRT.texture } },
          vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
          fragmentShader: [
            'varying vec2 vUv;',
            'uniform samplerCube cubeMap;',
            'void main() {',
            '  float theta = vUv.y * 3.14159265;',
            '  float phi = vUv.x * 6.28318531;',
            '  vec3 dir = vec3(sin(theta) * sin(phi), cos(theta), sin(theta) * cos(phi));',
            '  gl_FragColor = texture(cubeMap, dir);',
            '}'
          ].join('\n'),
          depthTest: false, depthWrite: false
        });
        skyEquirectConv = new THREE.Scene();
        skyEquirectConv.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), convMat));
        skyEquirectOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        skyEquirectRT.texture.mapping = THREE.EquirectangularReflectionMapping;
      }
      const prevRT = renderer.getRenderTarget();
      renderer.setRenderTarget(skyEquirectRT);
      renderer.render(skyEquirectConv, skyEquirectOrtho);
      renderer.setRenderTarget(prevRT);
      // Copia i pixel su CPU: il path tracer legge image.data per l'IBL
      const pixels = new Uint8Array(SKY_EQ_W * SKY_EQ_H * 4);
      renderer.readRenderTargetPixels(skyEquirectRT, 0, 0, SKY_EQ_W, SKY_EQ_H, pixels);
      if (!skyEquirectDataTex) {
        skyEquirectDataTex = new THREE.DataTexture(pixels, SKY_EQ_W, SKY_EQ_H, THREE.RGBAFormat);
        skyEquirectDataTex.mapping = THREE.EquirectangularReflectionMapping;
      } else {
        skyEquirectDataTex.image.data.set(pixels);
      }
      skyEquirectDataTex.needsUpdate = true;
    }
    function updateSunPosition(elevationDeg = 22, withEnv = true) {
      const azimuthDeg = 215; // Sud-Ovest (luce dorata obliqua nella vetrata)
      const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
      const theta = THREE.MathUtils.degToRad(azimuthDeg);
      sunDir.setFromSphericalCoords(1, phi, theta);
      const u = sky.material.uniforms;
      u['sunPosition'].value.copy(sunDir);
      u['turbidity'].value = 6;
      u['rayleigh'].value = 1.6;
      u['mieCoefficient'].value = 0.006;
      u['mieDirectionalG'].value = 0.85;
      sunLight.position.copy(sunDir).multiplyScalar(24);
      if (withEnv) updateEnvironment();
    }
    updateSunPosition(22, true);
    window.__dlog('sole+env OK');

    // 7b. Controlli: Walk (PointerLock) + Orbit
    const walkControls = new PointerLockControls(camera, renderer.domElement);
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.target.set(0, 1.4, -1);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.maxPolarAngle = Math.PI * 0.495;
    orbitControls.minDistance = 1;
    orbitControls.maxDistance = 30;
    orbitControls.enabled = false;

    let walkMode = true;
    const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    const btnWalk = document.getElementById('btn-walk');
    const btnOrbit = document.getElementById('btn-orbit');
    const crosshair = document.getElementById('crosshair');
    const helpHint = document.getElementById('help-hint');
    function setMode(walk) {
      walkMode = walk;
      btnWalk.classList.toggle('active', walk);
      btnOrbit.classList.toggle('active', !walk);
      crosshair.style.display = walk && !isTouchDevice ? 'block' : 'none';
      orbitControls.enabled = !walk;
      helpHint.innerHTML = walk
        ? (isTouchDevice
            ? 'Joystick per camminare • Trascina nella scena per guardarti intorno'
            : 'Clicca nella scena per guardarti intorno • <b>W A S D / Frecce</b> per camminare • <b>Shift</b> passo veloce • <b>ESC</b> libera il mouse')
        : 'Trascina per orbitare • Rotella / pizzica per zoomare • Tasto destro per pan';
      if (!walk && walkControls.isLocked) walkControls.unlock();
    }
    function tryPointerLock() {
      if (isTouchDevice || walkControls.isLocked) return;
      try {
        const p = walkControls.lock();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) { /* serve un gesto utente: l'utente cliccherà nella scena */ }
    }
    // ignora errori di pointer lock senza gesto (es. caricamento pagina)
    document.addEventListener('pointerlockerror', () => {}, true);
    btnWalk.onclick = () => { setMode(true); tryPointerLock(); };
    btnOrbit.onclick = () => setMode(false);
    renderer.domElement.addEventListener('click', () => {
      if (walkMode) tryPointerLock();
    });
    camera.lookAt(0, 1.3, -6); // vista iniziale verso la terrazza

    // 7c. Look touch (mobile): trascina nella scena per guardarti intorno
    let lookTouchId = null, lastTX = 0, lastTY = 0;
    const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (!walkMode || lookTouchId !== null) return;
      const t = e.changedTouches[0];
      lookTouchId = t.identifier; lastTX = t.clientX; lastTY = t.clientY;
      _euler.setFromQuaternion(camera.quaternion);
    }, { passive: true });
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!walkMode || lookTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lastTX, dy = t.clientY - lastTY;
          lastTX = t.clientX; lastTY = t.clientY;
          _euler.y -= dx * 0.0042;
          _euler.x = Math.max(-1.45, Math.min(1.45, _euler.x - dy * 0.0042));
          camera.quaternion.setFromEuler(_euler);
        }
      }
      e.preventDefault();
    }, { passive: false });
    const endLook = (e) => {
      for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
    };
    renderer.domElement.addEventListener('touchend', endLook);
    renderer.domElement.addEventListener('touchcancel', endLook);

    // 7d. Tastiera + joystick
    const keys = {};
    addEventListener('keydown', (e) => { keys[e.code] = true; });
    addEventListener('keyup', (e) => { keys[e.code] = false; });

    let joyF = 0, joyR = 0, joyId = null;
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    function joySet(dx, dy) {
      const m = Math.min(1, Math.hypot(dx, dy) / 40);
      const a = Math.atan2(dy, dx);
      joyR = Math.cos(a) * m; joyF = -Math.sin(a) * m;
      joyKnob.style.left = (35 + Math.cos(a) * 40 * m) + 'px';
      joyKnob.style.top = (35 + Math.sin(a) * 40 * m) + 'px';
    }
    joyZone.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0]; joyId = t.identifier; joySet(0, 0);
      e.preventDefault();
    }, { passive: false });
    joyZone.addEventListener('touchmove', (e) => {
      for (const t of e.changedTouches) if (t.identifier === joyId) {
        const r = joyZone.getBoundingClientRect();
        joySet(t.clientX - (r.left + r.width / 2), t.clientY - (r.top + r.height / 2));
      }
      e.preventDefault();
    }, { passive: false });
    const joyEnd = (e) => {
      for (const t of e.changedTouches) if (t.identifier === joyId) {
        joyId = null; joyF = 0; joyR = 0;
        joyKnob.style.left = '35px'; joyKnob.style.top = '35px';
      }
    };
    joyZone.addEventListener('touchend', joyEnd);
    joyZone.addEventListener('touchcancel', joyEnd);

    // 7e. Collisioni camminata (AABB 2D + limiti mondo)
    const PLAYER_R = 0.32;
    function collide() {
      const p = camera.position;
      for (const c of wallColliders) {
        const nx = Math.max(c.minX, Math.min(p.x, c.maxX));
        const nz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
        const dx = p.x - nx, dz = p.z - nz;
        const d2 = dx * dx + dz * dz;
        if (d2 < PLAYER_R * PLAYER_R) {
          if (d2 > 1e-8) {
            const d = Math.sqrt(d2);
            p.x = nx + (dx / d) * PLAYER_R;
            p.z = nz + (dz / d) * PLAYER_R;
          } else {
            const pushL = p.x - c.minX, pushR = c.maxX - p.x;
            const pushT = p.z - c.minZ, pushB = c.maxZ - p.z;
            const m = Math.min(pushL, pushR, pushT, pushB);
            if (m === pushL) p.x = c.minX - PLAYER_R;
            else if (m === pushR) p.x = c.maxX + PLAYER_R;
            else if (m === pushT) p.z = c.minZ - PLAYER_R;
            else p.z = c.maxZ + PLAYER_R;
          }
        }
      }
      p.x = Math.max(-3.4, Math.min(3.4, p.x));
      p.z = Math.max(-7.1, Math.min(3.1, p.z));
      p.y = 1.7;
    }
    function updateWalk(dt) {
      const fast = keys['ShiftLeft'] || keys['ShiftRight'];
      const speed = fast ? 4.6 : 2.2;
      const f = ((keys['KeyW'] || keys['ArrowUp']) ? 1 : 0) - ((keys['KeyS'] || keys['ArrowDown']) ? 1 : 0) + joyF;
      const r = ((keys['KeyD'] || keys['ArrowRight']) ? 1 : 0) - ((keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0) + joyR;
      if (f !== 0 || r !== 0) {
        walkControls.moveForward(f * speed * dt);
        walkControls.moveRight(r * speed * dt);
      }
      collide();
    }

    // 7f. Modalità render: PBR real-time vs Cycles path tracing
    const btnPbr = document.getElementById('btn-pbr');
    const btnCycles = document.getElementById('btn-cycles');
    const ptStatus = document.getElementById('pt-status');
    const sampleCountEl = document.getElementById('sample-count');
    let samples = 0;
    function setRenderMode(cycles) {
      isCyclesMode = cycles;
      btnPbr.classList.toggle('active', !cycles);
      btnCycles.classList.toggle('active', cycles);
      ptStatus.style.display = cycles ? 'block' : 'none';
      if (cycles) { initPathTracer(); samples = 0; }
      else { scene.background = null; scene.environment = pmremEnvTex; } // PBR: sky mesh + PMREM
    }
    btnPbr.onclick = () => setRenderMode(false);
    btnCycles.onclick = () => setRenderMode(true);

    // 7g. Export / import GLB
    document.getElementById('btn-export').onclick = () => {
      new GLTFExporter().parse(
        architectureGroup,
        (res) => {
          const blob = new Blob([res], { type: 'model/gltf-binary' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'villa-cala-luce.glb';
          document.body.appendChild(a); a.click(); a.remove();
        },
        (err) => console.error('Export error', err),
        { binary: true }
      );
    };
    document.getElementById('input-glb').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      new GLTFLoader().load(URL.createObjectURL(file), (gltf) => {
        scene.add(gltf.scene);
        if (isCyclesMode) initPathTracer(); // ricostruisce la BVH con la nuova geometria
      });
      e.target.value = '';
    });

    // 7h. Waypoint teleport + slider sole
    const WAYPOINTS = {
      ingresso: { pos: [0, 1.7, 1.9], look: [0, 1.3, -6.5] },
      divano:   { pos: [0.9, 1.7, 0.7], look: [-1.6, 0.7, 0.1] },
      cucina:   { pos: [-0.7, 1.7, 0.0], look: [1.35, 0.9, 1.6] },
      terrazza: { pos: [0, 1.7, -3.9], look: [0, 0.1, -7.0] },
    };
    window.teleportTo = (name) => {
      const w = WAYPOINTS[name];
      if (!w) return;
      camera.position.set(w.pos[0], w.pos[1], w.pos[2]);
      if (walkMode) camera.lookAt(w.look[0], w.look[1], w.look[2]);
      else orbitControls.target.set(w.look[0], w.look[1], w.look[2]);
      if (walkMode) collide();
      samples = 0;
    };
    const sunSlider = document.getElementById('sun-slider');
    sunSlider.addEventListener('input', () => updateSunPosition(parseFloat(sunSlider.value), false));
    sunSlider.addEventListener('change', () => updateSunPosition(parseFloat(sunSlider.value), true));

    // 7i. Main loop + resize
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (walkMode && (walkControls.isLocked || isTouchDevice)) updateWalk(dt);
      if (!walkMode) orbitControls.update();
      if (isCyclesMode && pathTracer && typeof pathTracer.renderSample === 'function') {
        pathTracer.renderSample();
        samples++;
        sampleCountEl.textContent = samples;
      } else {
        composer.render();
      }
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    setMode(true);
    setRenderMode(false);
    animate();
    window.__dlog('loop avviato OK');
  </script>
</body>
</html>
